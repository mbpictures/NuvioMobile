name: Build check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same PR.
concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android (compile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Bootstrap checkout of the base branch — only to load the trusted local
      # composite action below before we can reference ./.github/actions/*.
      - name: Checkout base for local actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          submodules: false

      # Compile the real merge of PR head into the current base tip (not
      # GitHub's precomputed, possibly-stale refs/pull/N/merge).
      - name: Checkout PR merged into base
        uses: ./.github/actions/checkout-pr-merge
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble Android (full, debug)
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full --stacktrace

      - name: Assemble Android (playstore, debug)
        run: ./gradlew :androidApp:assemblePlaystoreDebug -Pnuvio.android.distribution=playstore --stacktrace

  ios:
    name: iOS (compile)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NUVIO_IOS_DISTRIBUTION: full
    steps:
      # Bootstrap checkout of the base branch — only to load the trusted local
      # composite action below before we can reference ./.github/actions/*.
      - name: Checkout base for local actions
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1
          submodules: false

      # Compile the real merge of PR head into the current base tip (not
      # GitHub's precomputed, possibly-stale refs/pull/N/merge).
      - name: Checkout PR merged into base
        uses: ./.github/actions/checkout-pr-merge
        with:
          base-ref: ${{ github.event.pull_request.base.ref }}
          pr-number: ${{ github.event.pull_request.number }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Fetch Nuvio Engine Apple XCFramework
        uses: ./.github/actions/fetch-nuvio-engine-apple

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Install CocoaPods dependencies
        working-directory: iosApp
        run: pod install

      # Pre-download MPVKit's binary artifacts with retries so a flaky download
      # cannot poison the SwiftPM cache mid-build.
      - name: Resolve Swift package dependencies
        run: ./scripts/resolve-ios-packages.sh
        env:
          IOS_DERIVED_DATA_PATH: build/ios-derived-pr

      # Both iOS distributions (appstore / full) swap source dirs and deps,
      # so each must be type-checked independently.
      - name: Compile shared Kotlin/Native (appstore distribution)
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Compile shared Kotlin/Native (full distribution)
        run: ./gradlew :composeApp:compileKotlinIosArm64 :composeApp:compileKotlinIosSimulatorArm64 -Pnuvio.ios.distribution=full --stacktrace

      - name: Build iOS app (Debug, simulator destination, unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-pr \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

  # Desktop targets (macOS .dmg, Windows .exe, Linux) are not yet wired up in
  # composeApp/build.gradle.kts. Add a `jvm("desktop")` target with the Compose
  # Desktop plugin and matching `desktop` matrix jobs here once that lands.
